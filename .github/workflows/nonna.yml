name: Buongiornissimo Nonna

on:
  schedule:
    - cron: '30 6 * * *'   # 07:30 ora italiana — buongiorno
    - cron: '0 16 * * *'   # 18:00 ora italiana — buonanotte (anticipata)
  workflow_dispatch:
    inputs:
      momento:
        description: 'mattina o sera'
        required: false
        default: 'mattina'

permissions:
  contents: write

jobs:
  invia-foto:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests

      - name: Determina momento della giornata
        id: momento
        run: |
          ORA_UTC=$(date -u +%H)
          if [ "${{ github.event.inputs.momento }}" != "" ]; then
            echo "valore=${{ github.event.inputs.momento }}" >> $GITHUB_OUTPUT
          elif [ "$ORA_UTC" -lt 12 ]; then
            echo "valore=mattina" >> $GITHUB_OUTPUT
          else
            echo "valore=sera" >> $GITHUB_OUTPUT
          fi

      - run: python nonna.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          GIPHY_KEY: ${{ secrets.GIPHY_KEY }}
          MOMENTO: ${{ steps.momento.outputs.valore }}

      - name: Salva contatore
        run: |
          git config user.name "InvestoBot"
          git config user.email "bot@investobot.local"
          git add nonna_counter.txt
          git diff --staged --quiet || git commit -m "Aggiorna contatore nonna [skip ci]"
          git push
        continue-on-error: true
