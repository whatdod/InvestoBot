name: InvestoBot — Consiglio mensile

on:
  # Esegue il primo di ogni mese alle 09:00 ora italiana (08:00 UTC)
  schedule:
    - cron: '0 8 1 * *'
  # Permette di eseguire manualmente dalla tab Actions su GitHub
  workflow_dispatch:

jobs:
  analisi-mensile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa dipendenze
        run: pip install requests yfinance pandas numpy

      - name: Esegui analisi mensile
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          AV_KEY: ${{ secrets.AV_KEY }}
        run: python monthly.py
